<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Pecuaria por Vereda</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Consulta de Población Pecuaria por Vereda</h1>
        
        <!-- Filtros superiores -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <!-- Selector Desplegable de Municipios -->
            <div>
                <label for="municipioSelect" class="block text-sm font-medium text-gray-700 mb-1">Filtrar por Municipio:</label>
                <select id="municipioSelect" class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 bg-white">
                    <option value="">-- Todos los municipios --</option>
                </select>
            </div>

            <!-- Input de Búsqueda Rápida por Vereda -->
            <div>
                <label for="searchInput" class="block text-sm font-medium text-gray-700 mb-1">Buscar por Vereda:</label>
                <input type="text" id="searchInput" placeholder="Escribe el nombre de la vereda..." 
                       class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-green-700 text-white">
                        <th class="p-3">Amenaza</th>
                        <th class="p-3">Municipio</th>
                        <th class="p-3">Vereda</th>
                        <th class="p-3">Predios</th>
                        <th class="p-3">Total Animales</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-200">
                    <!-- Los datos se inyectarán dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let dataGlobal = [];

        // Cargar el archivo JSON usando la ruta directa de tu rama principal
        fetch('https://raw.githubusercontent.com/kaxtillo/Consulta_predios/principal/resumen_por_vereda.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('No se pudo cargar el archivo JSON');
                }
                return response.json();
            })
            .then(data => {
                dataGlobal = data;
                poblarSelectMunicipios(dataGlobal);
                renderTable(dataGlobal.slice(0, 50)); // Mostrar primeros 50 registros por rendimiento inicial
            })
            .catch(error => console.error('Error al cargar el archivo JSON:', error));

        // Función para llenar el menú desplegable con municipios únicos ordenados alfabéticamente
        function poblarSelectMunicipios(data) {
            const municipios = [...new Set(data.map(item => item.MUNICIPIO).filter(Boolean))].sort();
            const select = document.getElementById('municipioSelect');
            
            municipios.forEach(municipio => {
                const option = document.createElement('option');
                option.value = municipio;
                option.textContent = municipio;
                select.appendChild(option);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">No se encontraron resultados</td></tr>`;
                return;
            }

            data.forEach(row => {
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 font-semibold">${row.RIEGO || ''}</td>
                        <td class="p-3">${row.MUNICIPIO || ''}</td>
                        <td class="p-3">${row.VEREDA || ''}</td>
                        <td class="p-3">${row.Predios || 0}</td>
                        <td class="p-3 font-bold text-green-700">${row.Total_Animales || 0}</td>
                    </tr>
                `;
            });
        }

        // Función para filtrar datos combinando el selector y la barra de texto
        function aplicarFiltros() {
            const municipioSeleccionado = document.getElementById('municipioSelect').value.toLowerCase();
            const queryVereda = document.getElementById('searchInput').value.toLowerCase();

            const filtrados = dataGlobal.filter(item => {
                const coincideMunicipio = !municipioSeleccionado || (item.MUNICIPIO && item.MUNICIPIO.toLowerCase() === municipioSeleccionado);
                const coincideVereda = !queryVereda || (item.VEREDA && item.VEREDA.toLowerCase().includes(queryVereda));
                return coincideMunicipio && coincideVereda;
            });

            renderTable(filtrados.slice(0, 50));
        }

        // Eventos para actualizar la tabla dinámicamente al interactuar
        document.getElementById('municipioSelect').addEventListener('change', aplicarFiltros);
        document.getElementById('searchInput').addEventListener('input', aplicarFiltros);
    </script>
</body>
</html>
